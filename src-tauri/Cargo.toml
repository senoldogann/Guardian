[package]
name = "Guardian"
version = "1.2.6"
description = "Guardian is a desktop application that monitors your file system and detects changes in your projects. It uses AI to analyze the changes and provides you with insights about your projects."
authors = ["Senol Dogan"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "Guardian"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "guardian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }


[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2.0.0"
serde.workspace = true
serde_json.workspace = true
notify = "7.0.0"
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
tokio = { version = "1.35.0", features = ["full"] }
tempfile.workspace = true
chrono.workspace = true
base64 = "0.22.1"
anyhow.workspace = true
tauri-plugin-fs = "2.0.0"
walkdir = "2.5.0"
once_cell.workspace = true
dirs = "5.0.1"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-updater = "2.0.0"
ignore.workspace = true
rusqlite = { version = "0.38.0", features = ["bundled"] }
sha2.workspace = true
hex.workspace = true
dotenvy = "0.15.7"
url = "2.5.8"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
keyring = "2.3.0"
semver = "1.0.23"
jsonschema = "0.29.0"
secrecy.workspace = true
ed25519-dalek = "2"
rand = "0.8"
regex.workspace = true
lazy_static = "1.4"
dunce.workspace = true
similar = "2.6"
sqlite-vec = "0.1.7-alpha.2"
guardian-scan-policy.workspace = true
