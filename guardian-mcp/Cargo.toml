[package]
name = "guardian-mcp"
version = "1.3.1"
edition = "2021"
description = "MCP (Model Context Protocol) server for Guardian security scanner"

[[bin]]
name = "guardian-mcp"
path = "src/main.rs"

[dependencies]
guardian-scan-policy.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util"] }
