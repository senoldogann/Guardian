[workspace]
members = ["src-tauri", "guardian-cli", "guardian-scan-policy", "guardian-mcp", "guardian-rules"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.120"
anyhow = "1.0.79"
chrono = "0.4.33"
reqwest = { version = "0.12.5" }
once_cell = "1.19.0"
ignore = "0.4.25"
sha2 = "0.10.8"
hex = "0.4.3"
dunce = "1"
regex = "1.10"
secrecy = "0.10"
tempfile = "3.10.0"
guardian-scan-policy = { path = "guardian-scan-policy" }
