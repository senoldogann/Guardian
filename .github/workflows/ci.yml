name: CI

on:
  workflow_dispatch:
    inputs:
      os:
        description: "Runner OS to verify"
        required: true
        default: "windows-latest"
        type: choice
        options:
          - windows-latest
          - ubuntu-latest
          - macos-latest
          - all
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    strategy:
      matrix:
        os: ${{ fromJson((github.event_name == 'workflow_dispatch' && github.event.inputs.os != 'all') && format('["{0}"]', github.event.inputs.os) || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Security Audit
        run: |
          npm audit --audit-level=moderate
          cargo install cargo-audit --locked
          (cd src-tauri && cargo audit)

      - name: Verify
        run: npm run verify
