name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for manual runs), e.g. v0.2.5"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          if [ -z "$TAG" ]; then
            echo "Release tag is empty."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Ensure source release exists
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}
        shell: bash
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          REPO="${{ github.repository }}"

          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            if ! gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes "Automated release for $TAG"; then
              echo "Failed to create source release in $REPO."
              echo "Set SOURCE_REPO_TOKEN (PAT with repo write on source repo) or enable release creation for GITHUB_TOKEN."
              exit 1
            fi
          fi

  build:
    needs: prepare_release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Notarization is disabled until Apple notary credentials are rotated/verified.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            notarize: "false"
          - platform: macos-15-intel
            args: "--target x86_64-apple-darwin"
            notarize: "false"
          - platform: windows-latest
            args: "--target x86_64-pc-windows-msvc"
            notarize: "false"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Rust target (macOS)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Write Apple API Key (macOS notarized targets)
        if: runner.os == 'macOS' && matrix.notarize == 'true'
        id: apple_api_key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "${APPLE_API_KEY_P8}" ]; then
            echo "APPLE_API_KEY_P8 not set; skipping API key file creation."
            exit 0
          fi
          mkdir -p private_keys
          KEY_PATH=$(python - <<'PY'
          import base64, os, pathlib
          data = os.environ.get("APPLE_API_KEY_P8", "")
          key_id = os.environ.get("APPLE_API_KEY", "")
          path = pathlib.Path("private_keys") / f"AuthKey_{key_id}.p8"
          path.write_bytes(base64.b64decode(data))
          print(path.resolve())
          PY
          )
          echo "key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Build + Release (Tauri, notarized)
        if: matrix.notarize == 'true'
        uses: tauri-apps/tauri-action@action-v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ steps.apple_api_key.outputs.key_path }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ needs.prepare_release.outputs.tag }}
          releaseDraft: false
          releaseName: "${{ needs.prepare_release.outputs.tag }}"
          generateReleaseNotes: true
          includeUpdaterJson: true

      - name: Build + Release (Tauri, standard)
        if: matrix.notarize != 'true'
        uses: tauri-apps/tauri-action@action-v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ needs.prepare_release.outputs.tag }}
          releaseDraft: false
          releaseName: "${{ needs.prepare_release.outputs.tag }}"
          generateReleaseNotes: true
          includeUpdaterJson: true

      - name: Validate distribution configuration
        if: matrix.platform == 'macos-latest'
        id: dist_config
        shell: bash
        run: |
          DIST_REPO="${{ vars.PUBLIC_DIST_REPO }}"
          if [ -z "$DIST_REPO" ]; then
            DIST_REPO="${{ secrets.PUBLIC_DIST_REPO }}"
          fi

          if [ -z "$DIST_REPO" ]; then
            echo "Missing PUBLIC_DIST_REPO. Set it as Actions Variable (preferred) or Secret."
            exit 1
          fi

          if [ -z "${{ secrets.PUBLIC_DIST_REPO_TOKEN }}" ]; then
            echo "Missing secret PUBLIC_DIST_REPO_TOKEN (PAT with repo write on distribution repo)."
            exit 1
          fi

          echo "repo=$DIST_REPO" >> "$GITHUB_OUTPUT"

      - name: Wait for all platform assets
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ needs.prepare_release.outputs.tag }}"
          SRC_REPO="${{ github.repository }}"

          for attempt in $(seq 1 60); do
            ASSET_LIST="$(gh release view "$TAG" --repo "$SRC_REPO" --json assets -q '.assets[].name' 2>/dev/null || true)"

            if echo "$ASSET_LIST" | grep -q 'aarch64-apple-darwin' \
              && echo "$ASSET_LIST" | grep -q 'x86_64-apple-darwin' \
              && echo "$ASSET_LIST" | grep -q 'x86_64-pc-windows-msvc'; then
              echo "All platform assets are available."
              exit 0
            fi

            echo "Waiting for all platform assets (attempt ${attempt}/60)..."
            sleep 10
          done

          echo "Timed out waiting for all platform assets in source release."
          exit 1

      - name: Download release assets from source repo
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ needs.prepare_release.outputs.tag }}"
          mkdir -p dist-assets
          gh release download "$TAG" --repo "${{ github.repository }}" --dir dist-assets
          ls -la dist-assets

      - name: Prepare public release notes
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ needs.prepare_release.outputs.tag }}"
          gh release view "$TAG" --repo "${{ github.repository }}" --json body -q '.body // ""' > RELEASE_NOTES.md

      - name: Publish assets to public distribution repo
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_DIST_REPO_TOKEN }}
        shell: bash
        run: |
          TAG="${{ needs.prepare_release.outputs.tag }}"
          DIST_REPO="${{ steps.dist_config.outputs.repo }}"

          if ! gh release view "$TAG" --repo "$DIST_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$DIST_REPO" --title "$TAG" --notes-file RELEASE_NOTES.md
          fi

          gh release upload "$TAG" dist-assets/* --repo "$DIST_REPO" --clobber
