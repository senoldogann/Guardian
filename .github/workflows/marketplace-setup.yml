name: 🔧 Marketplace Publisher Setup

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "diagnose"
        type: choice
        options:
          - diagnose
          - create-and-publish
      publisher_name:
        description: "Publisher ID (must match package.json publisher field)"
        required: true
        default: "senoldogann"
        type: string

permissions:
  contents: read

jobs:
  marketplace-setup:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: 🔍 Diagnose publisher status
        if: ${{ inputs.action == 'diagnose' }}
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHER="${{ inputs.publisher_name }}"

          echo "=== Step 1: Public API lookup ==="
          RESULT=$(curl -s -X POST \
            'https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json;api-version=7.2-preview.1' \
            -d "{\"filters\":[{\"criteria\":[{\"filterType\":10,\"value\":\"$PUBLISHER\"}]}],\"flags\":950}")

          echo "$RESULT" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          exts = d['results'][0]['extensions']
          exact = [e for e in exts if e['publisher']['publisherName'].lower() == '${PUBLISHER}'.lower()]
          if exact:
              print(f'Publisher EXISTS with {len(exact)} extension(s):')
              for e in exact:
                  print(f'  {e[\"publisher\"][\"publisherName\"]}.{e[\"extensionName\"]} v{e[\"versions\"][0][\"version\"]}')
          else:
              print(f'Publisher \"{PUBLISHER}\" NOT FOUND in public API.')
              print('You may need to create it at: https://marketplace.visualstudio.com/manage/createpublisher')
          " 2>&1 || true

          echo ""
          echo "=== Step 2: PAT verification ==="
          npx --yes @vscode/vsce verify-pat "$PUBLISHER" -p "$VSCE_PAT" 2>&1 && {
            echo "PAT is valid for publisher '$PUBLISHER'."
          } || {
            echo ""
            echo "PAT verification FAILED."
            echo ""
            echo "FIX: Go to https://dev.azure.com/<your-org>/_usersSettings/tokens"
            echo "  1. Edit or create a new PAT"
            echo "  2. Set Organization to 'All accessible organizations'"
            echo "  3. Under Scopes, check 'Marketplace > Manage'"
            echo "  4. Save and update VSCE_PAT secret in GitHub"
          }

          echo ""
          echo "=== Step 3: Extension lookup ==="
          npx --yes @vscode/vsce show "$PUBLISHER.guardian-code-governance" 2>&1 || echo "Extension not publicly visible."
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: 🚀 Create publisher and publish extension
        if: ${{ inputs.action == 'create-and-publish' }}
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHER="${{ inputs.publisher_name }}"

          echo "=== Verifying PAT scope ==="
          if ! npx --yes @vscode/vsce verify-pat "$PUBLISHER" -p "$VSCE_PAT" 2>&1; then
            echo ""
            echo "ERROR: PAT does not have Marketplace Manage scope."
            echo ""
            echo "Before running this workflow, you MUST:"
            echo "  1. Go to https://dev.azure.com/<your-org>/_usersSettings/tokens"
            echo "  2. Create a PAT with:"
            echo "     - Organization: 'All accessible organizations'"
            echo "     - Scopes: 'Marketplace > Manage'"
            echo "  3. Update the VSCE_PAT secret in GitHub Settings > Secrets"
            echo "  4. (If publisher doesn't exist) Create it at:"
            echo "     https://marketplace.visualstudio.com/manage/createpublisher"
            echo "     Use publisher ID: $PUBLISHER"
            exit 1
          fi

          echo "PAT verified for publisher '$PUBLISHER'."
          echo ""

          echo "=== Building and publishing extension ==="
          cd guardian-vscode
          npm ci
          npm run compile
          npx --yes @vscode/vsce package

          VSIX_PATH="$(find . -maxdepth 1 -name '*.vsix' | head -1)"
          echo "Publishing $VSIX_PATH..."
          npx --yes @vscode/vsce publish --packagePath "$VSIX_PATH" -p "$VSCE_PAT"

          echo ""
          echo "=== Post-publish verification (waiting 30s) ==="
          sleep 30

          if npx --yes @vscode/vsce show "$PUBLISHER.guardian-code-governance" 2>&1; then
            echo "Extension is publicly visible!"
          else
            echo "::warning::Extension not yet visible. Marketplace indexing may take a few minutes."
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
