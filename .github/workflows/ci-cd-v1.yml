# Guardian CI/CD Pipeline
# Uses GitHub-hosted runners (ubuntu-latest)

name: 🚀 Guardian CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/pnpm-lock.yaml"
      - "**/yarn.lock"
      - "**/bun.lockb"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  workflow_dispatch:

jobs:
  release-gate-ci-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 🏗️ Build guardian-cli (release)
        run: cargo build --release --manifest-path guardian-cli/Cargo.toml

      - name: 🚦 Run Release Gate CI Smoke
        run: bash scripts/ci/release_gate_ci_smoke.sh

  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🐧 Install Linux System Dependencies (Tauri/GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev

          # Ubuntu version compatibility for WebKit/JavaScriptCore/Soup
          if ! sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev; then
            sudo apt-get install -y libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev libsoup2.4-dev
          fi

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: 📦 Install Root Dependencies
        run: npm ci

      - name: 🔐 Secret Pattern Scan
        run: bash scripts/secret_scan.sh

      - name: 🧹 Check Formatting
        run: npm run format:check

      - name: 🔎 Run Lint
        run: npm run lint

      - name: 🧪 Run Unit Tests
        run: npm run test

      - name: 📊 Generate Coverage Report + Gate
        run: |
          npm run test:coverage
          npm run coverage:gate

      - name: 🔨 Build Desktop App
        run: npm run build

      - name: 🦀 Check Rust Code
        run: cd src-tauri && cargo check

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: guardian-build-v1.0.0
          path: |
            dist/
            src-tauri/target/
          retention-days: 7

  build-tauri:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6

      - name: 🐧 Install Linux System Dependencies (Tauri/GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev

          # Ubuntu version compatibility for WebKit/JavaScriptCore/Soup
          if ! sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev; then
            sudo apt-get install -y libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev libsoup2.4-dev
          fi

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "npm"

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Tauri App
        run: npm run tauri build
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: 📤 Upload Tauri Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: guardian-tauri-v1.0.0
          path: |
            src-tauri/target/release/bundle/
          retention-days: 30

  website-build:
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "npm"

      - name: 📦 Install Website Dependencies
        run: |
          cd website
          npm ci

      - name: 🧭 Website Copy Consistency Gate
        run: |
          cd website
          npm run copy:check

      - name: 🧪 Run Website Tests
        run: |
          cd website
          npm run test:run

      - name: 📊 Website Coverage
        run: |
          cd website
          npm run test:coverage
        continue-on-error: true

      - name: 🔨 Build Website
        run: |
          cd website
          npm run build
        env:
          GITHUB_RELEASE_OWNER: ${{ secrets.GITHUB_RELEASE_OWNER }}
          GITHUB_RELEASE_REPO: ${{ secrets.GITHUB_RELEASE_REPO }}
          GITHUB_PUBLIC_READ_TOKEN: ${{ secrets.GITHUB_PUBLIC_READ_TOKEN }}

      - name: 📤 Upload Website Build
        uses: actions/upload-artifact@v6
        with:
          name: guardian-website-v1.0.0
          path: website/.next/
          retention-days: 7

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [test-and-build, website-build]
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "npm"

      - name: 📦 Install Dependencies
        run: |
          npm ci
          cd website && npm ci

      - name: 🎭 Install Playwright Browsers
        run: |
          npx playwright install chromium
          cd website && npx playwright install chromium

      - name: 🧪 Run E2E Tests (Desktop)
        run: npm run test:e2e

      - name: 🌐 Run E2E Tests (Website)
        run: |
          cd website
          npm run test:e2e

      - name: 📤 Upload Test Results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report-v1.0.0
          path: |
            playwright-report/
            website/playwright-report/
          retention-days: 7

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: 🔒 NPM Audit - Critical (Root)
        run: npm audit --audit-level=critical

      - name: 🔒 NPM Audit - Moderate (Root)
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: 🔒 NPM Audit - Critical (Website)
        run: |
          cd website
          npm audit --audit-level=critical

      - name: 🔒 NPM Audit - Moderate (Website)
        run: |
          cd website
          npm audit --audit-level=moderate
        continue-on-error: true

      - name: 🐧 Install Linux System Dependencies (Tauri/GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev

          # Ubuntu version compatibility for WebKit/JavaScriptCore/Soup
          if ! sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev; then
            sudo apt-get install -y libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev libsoup2.4-dev
          fi

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 🦀 Check Rust Formatting
        run: cd src-tauri && cargo fmt --check

      - name: 🦀 Run Clippy Lints
        run: cd src-tauri && cargo clippy -- -D warnings

      - name: 🦀 Cargo Audit (Tauri)
        run: |
          cd src-tauri
          cargo audit 2>&1 || true
        continue-on-error: true
