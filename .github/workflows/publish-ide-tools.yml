name: 🧩 Publish IDE Tools

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.3.0)"
        required: true
        type: string
      publish_marketplace:
        description: "Publish guardian-vscode to the VS Code Marketplace"
        required: true
        default: true
        type: boolean
      dist_repo:
        description: "Distribution repo that already hosts the release tag"
        required: true
        default: "senoldogann/guardian-distribution"
        type: string

permissions:
  contents: write

concurrency:
  group: publish-ide-tools-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      publisher: ${{ steps.validate.outputs.publisher }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🔎 Verify IDE version alignment
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ inputs.tag }}"
          expected="${expected#v}"

          vscode_version="$(node -p "require('./guardian-vscode/package.json').version")"
          mcp_version="$(grep -E '^version[[:space:]]*=[[:space:]]*"' guardian-mcp/Cargo.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
          publisher="$(node -p "require('./guardian-vscode/package.json').publisher")"

          if [[ "$vscode_version" != "$expected" || "$mcp_version" != "$expected" ]]; then
            echo "Release version mismatch. Tag: v$expected"
            echo "guardian-vscode/package.json: $vscode_version"
            echo "guardian-mcp/Cargo.toml: $mcp_version"
            exit 1
          fi

          if [[ -z "$publisher" || "$publisher" == "CHANGE_ME" ]]; then
            echo "guardian-vscode/package.json publisher is not configured."
            exit 1
          fi

          echo "version=$expected" >> "$GITHUB_OUTPUT"
          echo "publisher=$publisher" >> "$GITHUB_OUTPUT"
          echo "Using publisher: $publisher"

      - name: 🔍 Verify distribution release exists
        shell: bash
        run: |
          set -euo pipefail
          DIST_REPO="${{ inputs.dist_repo }}"
          TAG="${{ inputs.tag }}"

          if ! gh release view "$TAG" -R "$DIST_REPO" >/dev/null 2>&1; then
            echo "Distribution release '$TAG' not found in '$DIST_REPO'."
            echo "Run the primary Guardian release flow first, then dispatch this workflow with the same tag."
            exit 1
          fi

          echo "Distribution release confirmed: $TAG"
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_DIST_REPO_TOKEN }}

      - name: 🔐 Verify VSCE_PAT secret
        if: ${{ inputs.publish_marketplace }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VSCE_PAT:-}" ]]; then
            echo "VSCE_PAT secret is required for marketplace publishing but is not configured."
            exit 1
          fi

          echo "VSCE_PAT secret confirmed"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  package-vscode:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: guardian-vscode/package-lock.json

      - name: 📦 Install guardian-vscode dependencies
        run: cd guardian-vscode && npm ci

      - name: ✅ Validate guardian-vscode
        run: cd guardian-vscode && npm run validate

      - name: 📤 Upload guardian-vscode package
        uses: actions/upload-artifact@v8
        with:
          name: guardian-vscode-${{ inputs.tag }}
          path: guardian-vscode/*.vsix
          retention-days: 7

  build-mcp-linux:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 🏗️ Build guardian-mcp (Linux)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p guardian-mcp
          mkdir -p dist
          cp target/release/guardian-mcp dist/guardian-mcp
          tar -czf "guardian-mcp-linux-x64-${{ needs.validate.outputs.version }}.tar.gz" -C dist guardian-mcp

      - name: 📤 Upload guardian-mcp Linux package
        uses: actions/upload-artifact@v8
        with:
          name: guardian-mcp-linux-${{ inputs.tag }}
          path: guardian-mcp-linux-x64-${{ needs.validate.outputs.version }}.tar.gz
          retention-days: 7

  build-mcp-macos:
    runs-on: macos-latest
    needs: validate
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 🦀 Add macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: 🏗️ Build guardian-mcp (macOS universal)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p guardian-mcp --target aarch64-apple-darwin
          cargo build --release -p guardian-mcp --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/guardian-mcp \
            target/x86_64-apple-darwin/release/guardian-mcp \
            -output dist/guardian-mcp
          tar -czf "guardian-mcp-darwin-universal-${{ needs.validate.outputs.version }}.tar.gz" -C dist guardian-mcp

      - name: 📤 Upload guardian-mcp macOS package
        uses: actions/upload-artifact@v8
        with:
          name: guardian-mcp-macos-${{ inputs.tag }}
          path: guardian-mcp-darwin-universal-${{ needs.validate.outputs.version }}.tar.gz
          retention-days: 7

  build-mcp-windows:
    runs-on: windows-latest
    needs: validate
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 🏗️ Build guardian-mcp (Windows)
        shell: pwsh
        run: |
          cargo build --release -p guardian-mcp
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/guardian-mcp.exe dist/guardian-mcp.exe -Force
          Compress-Archive -Path dist/guardian-mcp.exe -DestinationPath "guardian-mcp-windows-x64-${{ needs.validate.outputs.version }}.zip" -Force

      - name: 📤 Upload guardian-mcp Windows package
        uses: actions/upload-artifact@v8
        with:
          name: guardian-mcp-windows-${{ inputs.tag }}
          path: guardian-mcp-windows-x64-${{ needs.validate.outputs.version }}.zip
          retention-days: 7

  publish-distribution:
    runs-on: ubuntu-latest
    needs:
      - validate
      - package-vscode
      - build-mcp-linux
      - build-mcp-macos
      - build-mcp-windows
    steps:
      - name: 🔑 Setup GitHub CLI
        run: gh auth status
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_DIST_REPO_TOKEN }}

      - name: 📦 Download guardian-vscode package
        uses: actions/download-artifact@v8
        with:
          name: guardian-vscode-${{ inputs.tag }}
          path: dist

      - name: 📦 Download guardian-mcp Linux package
        uses: actions/download-artifact@v8
        with:
          name: guardian-mcp-linux-${{ inputs.tag }}
          path: dist

      - name: 📦 Download guardian-mcp macOS package
        uses: actions/download-artifact@v8
        with:
          name: guardian-mcp-macos-${{ inputs.tag }}
          path: dist

      - name: 📦 Download guardian-mcp Windows package
        uses: actions/download-artifact@v8
        with:
          name: guardian-mcp-windows-${{ inputs.tag }}
          path: dist

      - name: 🧾 Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          rm -f checksums.txt
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 shasum -a 256 > checksums.txt

      - name: 📦 Upload IDE assets to distribution release
        shell: bash
        run: |
          set -euo pipefail
          DIST_REPO="${{ inputs.dist_repo }}"
          TAG="${{ inputs.tag }}"

          if ! gh release view "$TAG" -R "$DIST_REPO" >/dev/null 2>&1; then
            echo "Distribution release '$TAG' not found in '$DIST_REPO'."
            echo "Run the primary Guardian release flow first, then dispatch this workflow with the same tag."
            exit 1
          fi

          RELEASE_ASSETS=()
          while IFS= read -r -d '' asset_path; do
            RELEASE_ASSETS+=("$asset_path")
          done < <(find dist -maxdepth 1 -type f -print0)

          if [[ "${#RELEASE_ASSETS[@]}" -eq 0 ]]; then
            echo "No IDE assets found to upload."
            exit 1
          fi

          gh release upload "$TAG" "${RELEASE_ASSETS[@]}" -R "$DIST_REPO" --clobber
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_DIST_REPO_TOKEN }}

  publish-marketplace:
    if: ${{ inputs.publish_marketplace }}
    runs-on: ubuntu-latest
    needs:
      - validate
      - package-vscode
    steps:
      - name: 📦 Download guardian-vscode package
        uses: actions/download-artifact@v8
        with:
          name: guardian-vscode-${{ inputs.tag }}
          path: dist

      - name: 🚀 Publish guardian-vscode to Marketplace
        shell: bash
        run: |
          set -euo pipefail

          VSIX_PATH="$(find dist -maxdepth 1 -type f -name '*.vsix' | head -n 1)"
          if [[ -z "$VSIX_PATH" ]]; then
            echo "No .vsix package found to publish."
            exit 1
          fi

          VSIX_SIZE="$(stat -c%s "$VSIX_PATH")"
          if [[ "$VSIX_SIZE" -lt 10000 ]]; then
            echo "VSIX package is suspiciously small: ${VSIX_SIZE} bytes"
            exit 1
          fi

          echo "Publishing ${VSIX_PATH} for publisher '${{ needs.validate.outputs.publisher }}'"
          npx --yes @vscode/vsce publish --packagePath "$VSIX_PATH" -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: ✅ Verify guardian-vscode Marketplace release
        shell: bash
        run: |
          set -euo pipefail

          EXTENSION_ID="${{ needs.validate.outputs.publisher }}.guardian-code-governance"
          TARGET_VERSION="${{ needs.validate.outputs.version }}"

          for attempt in 1 2 3 4 5; do
            OUTPUT="$(npx --yes @vscode/vsce show "$EXTENSION_ID" 2>/dev/null || true)"
            if printf '%s' "$OUTPUT" | grep -Eq "Version:[[:space:]]*${TARGET_VERSION}"; then
              echo "Marketplace publish verified for ${EXTENSION_ID} ${TARGET_VERSION}"
              exit 0
            fi

            echo "Marketplace version not visible yet (attempt ${attempt}/5)."
            sleep 15
          done

          echo "Marketplace publish could not be verified for ${EXTENSION_ID} ${TARGET_VERSION}."
          exit 1