name: "Guardian Scan (PR Summary)"

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write
  security-events: write

jobs:
  guardian-scan:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Resolve artifact suffix"
        id: meta
        run: |
          VERSION="$(python3 -c "import json, pathlib; print(json.loads(pathlib.Path('package.json').read_text(encoding='utf-8'))['version'])")"
          SHORT_SHA="${GITHUB_SHA::12}"
          echo "artifact_suffix=v${VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: "Prepare runtime artifact paths"
        run: |
          {
            echo "GUARDIAN_REPORT_JSON=$RUNNER_TEMP/guardian-report.json"
            echo "GUARDIAN_SARIF=$RUNNER_TEMP/guardian.sarif"
            echo "GUARDIAN_MANIFEST=$RUNNER_TEMP/guardian-run-manifest.json"
            echo "GUARDIAN_EVIDENCE=$RUNNER_TEMP/guardian-evidence.json"
          } >> "$GITHUB_ENV"

      - name: "Setup Rust"
        uses: dtolnay/rust-toolchain@stable

      - name: "Setup Node"
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: "Build guardian-cli"
        run: |
          cd guardian-cli
          cargo build --release

      - name: "Run guardian-cli scan (SARIF)"
        if: github.event_name == 'pull_request'
        run: |
          guardian-cli/target/release/guardian-cli scan \
            --root . \
            --format sarif \
            --out "$GUARDIAN_SARIF" \
            --offline \
            --scan-profile source \
            --pr-gate off

      - name: "Upload SARIF"
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && (github.event.pull_request.head.repo.fork == false || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: ${{ runner.temp }}/guardian.sarif

      - name: "Skip SARIF upload for restricted PR token"
        if: github.event_name == 'pull_request' && (github.actor == 'dependabot[bot]' || (github.event.pull_request.head.repo.fork == true && github.event.pull_request.head.repo.full_name != github.repository))
        run: echo "Skipping SARIF upload for restricted pull_request token context."

      - name: "Run guardian-cli scan (JSON)"
        id: scan
        run: |
          set +e
          guardian-cli/target/release/guardian-cli scan \
            --root . \
            --format json \
            --out "$GUARDIAN_REPORT_JSON" \
            --emit-manifest "$GUARDIAN_MANIFEST" \
            --emit-evidence "$GUARDIAN_EVIDENCE" \
            --offline \
            --scan-profile source \
            --pr-gate critical-only
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: "Render PR comment"
        if: github.event_name == 'pull_request'
        run: node scripts/ci/render_guardian_pr_comment.mjs "$GUARDIAN_REPORT_JSON" > guardian-pr-comment.md

      - name: "Post PR comment"
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: guardian-pr-comment.md

      - name: "Collect artifacts"
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .guardian/ci

          for mapping in \
            "$GUARDIAN_REPORT_JSON:.guardian/ci/guardian-report.json" \
            "$GUARDIAN_MANIFEST:.guardian/ci/guardian-run-manifest.json" \
            "$GUARDIAN_EVIDENCE:.guardian/ci/guardian-evidence.json"; do
            src="${mapping%%:*}"
            dest="${mapping##*:}"
            if [[ ! -f "$src" ]]; then
              echo "::error::Expected Guardian scan artifact missing: $src"
              exit 1
            fi
            cp -f "$src" "$dest"
          done

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if [[ ! -f "$GUARDIAN_SARIF" ]]; then
              echo "::error::Expected Guardian SARIF artifact missing: $GUARDIAN_SARIF"
              exit 1
            fi
            cp -f "$GUARDIAN_SARIF" .guardian/ci/guardian.sarif
          fi

      - name: "Write PR gate report"
        if: always()
        run: |
          report_status="pass"
          command_status="pass"
          if [[ "${{ steps.scan.outputs.exit_code }}" != "0" ]]; then
            report_status="fail"
            command_status="fail"
          fi

          python3 scripts/ci/write_gate_report.py \
            --report-type pr-gate \
            --status "$report_status" \
            --policy "critical=block,moderate=track-14d" \
            --output .guardian/ci/guardian-pr-gate-report.json \
            --command guardian-cli-pr-gate "$command_status" .guardian/ci/guardian-report.json \
            --note "SARIF upload can be skipped automatically for restricted PR token contexts."

      - name: "Upload scan artifacts"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: guardian-scan-${{ steps.meta.outputs.artifact_suffix }}
          path: |
            .guardian/ci/guardian-report.json
            .guardian/ci/guardian.sarif
            .guardian/ci/guardian-run-manifest.json
            .guardian/ci/guardian-evidence.json
            .guardian/ci/guardian-pr-gate-report.json
            guardian-pr-comment.md
          retention-days: 7

      - name: "PR gate (fail on new critical)"
        if: steps.scan.outputs.exit_code != '0'
        run: exit 1
