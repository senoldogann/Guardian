[package]
name = "guardian-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
dunce = "1"
hex = "0.4"
ignore = "0.4"
once_cell = "1.19"
regex = "1.10"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
